name: label.info
description: |
   Label.
author: "CMD"
type: SERVER_EVENT

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows' OR OS = 'linux' OR OS = 'darwin'

    query: |
      LET interrogations = SELECT * FROM watch_monitoring(artifact="System.Flow.Completion")
      -- WHERE Flow.artifacts_with_results =~"Generic.Client.Info/BasicInformation"
      WHERE Flow.artifacts_with_results =~"Generic.Client.Info"
      LET results = SELECT *, ClientId FROM source(artifact="Generic.Client.Info/BasicInformation",client_id=ClientId, flow_id=FlowId)
      -- LET results = SELECT *, ClientId FROM source(artifact="Generic.Client.Info",client_id=ClientId, flow_id=FlowId)
        SELECT * label(client_id=ClientId, labels=[Hostname, Architecture, Platform, PlatformVersion, KernelVersion], op= "set") FROM foreach(row=interrogations, query=results)
